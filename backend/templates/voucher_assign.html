{% extends 'base.html' %}
{% block content %}
<div class="module-header">
    <div style="display:flex;align-items:center;gap:12px;">
        <div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg, #6c1fb0, #9a22c7);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;">
            <i class="fas fa-cart-plus"></i>
        </div>
        <div>
            <h2 style="margin:0;font-size:1.45rem;font-weight:800;color:#0f172a;">Sell / Assign Exam Voucher</h2>
            <p style="margin:2px 0 0;font-size:0.84rem;color:#64748b;">Assign an available voucher to a candidate with custom pricing &amp; payment tracking</p>
        </div>
    </div>
    <a class="btn-secondary" href="{{ url_for('vouchers.dashboard', tab='sold') }}" style="text-decoration:none;">
        <i class="fas fa-arrow-left"></i> Back to Dashboard
    </a>
</div>

<div class="panel" style="max-width:820px;margin:0 auto;padding:28px;border-radius:20px;">
    <form method="POST" action="{{ url_for('vouchers.sell') }}" class="form-grid">
        <!-- 1. Voucher Selection -->
        <div class="form-row">
            <label style="font-weight:700;">Select Available Voucher *</label>
            <select name="voucher_id" id="assignVoucherSelect" required style="padding:11px 14px;border-radius:12px;" onchange="onVoucherChange(this)">
                <option value="">-- Choose an available voucher --</option>
                {% for v in available %}
                <option value="{{ v.id }}" data-price="{{ v.selling_price }}" data-cost="{{ v.purchase_cost }}">
                    {{ v.voucher_code }} — {{ v.exam_type.name if v.exam_type else 'Exam' }} (Cost ₹{{ '%.2f'|format(v.purchase_cost) }} | Default Sell ₹{{ '%.2f'|format(v.selling_price) }})
                </option>
                {% endfor %}
            </select>
        </div>

        <!-- 2. Candidate Information -->
        <div style="font-size:0.85rem;font-weight:800;color:#6c1fb0;text-transform:uppercase;letter-spacing:0.5px;margin:16px 0 8px;">
            Candidate Information
        </div>

        {% if students %}
        <div class="form-row">
            <label style="font-weight:700;">Select Existing Candidate (Optional autofill)</label>
            <select id="candSelect" onchange="autofillCandidate(this)" style="padding:11px 14px;border-radius:12px;">
                <option value="">-- Or enter new student below --</option>
                {% for s in students %}
                <option value="{{ s.id }}" data-name="{{ s.name }}" data-phone="{{ s.phone or '' }}" data-email="{{ s.email or '' }}" data-reg="{{ s.register_number or '' }}">
                    {{ s.name }}{% if s.register_number %} ({{ s.register_number }}){% endif %}
                </option>
                {% endfor %}
            </select>
            <input type="hidden" name="candidate_id" id="linkedCandidateId">
        </div>
        {% endif %}

        <div class="form-row">
            <label style="font-weight:700;">Student / Candidate Full Name *</label>
            <input type="text" name="student_name" id="candName" placeholder="Full legal name" required style="padding:11px 14px;border-radius:12px;">
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
            <div class="form-row">
                <label style="font-weight:700;">Mobile Number</label>
                <input type="text" name="mobile" id="candMobile" placeholder="e.g. 9876543210" style="padding:11px 14px;border-radius:12px;">
            </div>
            <div class="form-row">
                <label style="font-weight:700;">ID / Register Number</label>
                <input type="text" name="id_number" id="candIdNum" placeholder="ID / IC number" style="padding:11px 14px;border-radius:12px;">
            </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
            <div class="form-row">
                <label style="font-weight:700;">Email Address</label>
                <input type="email" name="email" id="candEmail" placeholder="candidate@example.com" style="padding:11px 14px;border-radius:12px;">
            </div>
            <div class="form-row">
                <label style="font-weight:700;">Residential / Branch Address</label>
                <input type="text" name="address" placeholder="Address..." style="padding:11px 14px;border-radius:12px;">
            </div>
        </div>

        <!-- 3. Pricing & Payment Breakdown -->
        <div style="font-size:0.85rem;font-weight:800;color:#6c1fb0;text-transform:uppercase;letter-spacing:0.5px;margin:16px 0 8px;">
            Sale Pricing &amp; Payment Breakdown
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
            <div class="form-row">
                <label style="font-weight:700;">Selling Price (₹) *</label>
                <input type="number" step="0.01" min="0" name="selling_price" id="assignPrice" required value="0.00" oninput="calcFinal()" style="padding:11px 14px;border-radius:12px;">
            </div>
            <div class="form-row">
                <label style="font-weight:700;">Discount (₹)</label>
                <input type="number" step="0.01" min="0" name="discount" id="assignDiscount" value="0.00" oninput="calcFinal()" style="padding:11px 14px;border-radius:12px;">
            </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
            <div class="form-row">
                <label style="font-weight:700;">Payment Mode</label>
                <select name="payment_mode" style="padding:11px 14px;border-radius:12px;">
                    <option value="Cash">Cash</option>
                    <option value="UPI">UPI</option>
                    <option value="Card">Card</option>
                    <option value="Bank Transfer">Bank Transfer</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-row">
                <label style="font-weight:700;">Payment Status *</label>
                <select name="payment_status" id="assignPayStatus" style="padding:11px 14px;border-radius:12px;" onchange="syncPaidAmt()">
                    <option value="Paid">Paid</option>
                    <option value="Pending">Pending</option>
                    <option value="Partial">Partial</option>
                </select>
            </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
            <div class="form-row">
                <label style="font-weight:700;">Paid Amount (₹)</label>
                <input type="number" step="0.01" min="0" name="paid_amount" id="assignPaidAmt" value="0.00" oninput="calcBalance()" style="padding:11px 14px;border-radius:12px;">
            </div>
            <div class="form-row">
                <label style="font-weight:700;">Pending Balance</label>
                <div id="assignBalanceDisplay" style="height:46px;display:flex;align-items:center;padding:0 14px;background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:12px;font-weight:800;color:#10b981;font-size:1.1rem;">
                    ₹ 0.00
                </div>
            </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
            <div class="form-row">
                <label style="font-weight:700;">Payment Reference</label>
                <input type="text" name="payment_reference" placeholder="Transaction ID, cheque no..." style="padding:11px 14px;border-radius:12px;">
            </div>
            <div class="form-row">
                <label style="font-weight:700;">Notes / Remarks</label>
                <input type="text" name="notes" placeholder="Optional notes..." style="padding:11px 14px;border-radius:12px;">
            </div>
        </div>

        <div class="button-row" style="margin-top:20px;display:flex;gap:12px;">
            <button class="btn-primary" type="submit" style="padding:12px 24px;border-radius:14px;background:linear-gradient(135deg, #6c1fb0, #9a22c7);font-size:0.92rem;">
                <i class="fas fa-cart-plus"></i> Complete Sale &amp; Issue Voucher
            </button>
            <a class="btn-secondary" href="{{ url_for('vouchers.dashboard', tab='sold') }}" style="padding:12px 24px;border-radius:14px;">Cancel</a>
        </div>
    </form>
</div>

<script>
function onVoucherChange(sel) {
    var opt = sel.options[sel.selectedIndex];
    if (opt && opt.value) {
        var price = parseFloat(opt.getAttribute('data-price')) || 0;
        document.getElementById('assignPrice').value = price.toFixed(2);
        calcFinal();
    }
}

function autofillCandidate(sel) {
    var opt = sel.options[sel.selectedIndex];
    if (opt && opt.value) {
        document.getElementById('linkedCandidateId').value = opt.value;
        document.getElementById('candName').value = opt.getAttribute('data-name') || '';
        document.getElementById('candMobile').value = opt.getAttribute('data-phone') || '';
        document.getElementById('candEmail').value = opt.getAttribute('data-email') || '';
        document.getElementById('candIdNum').value = opt.getAttribute('data-reg') || '';
    } else {
        document.getElementById('linkedCandidateId').value = '';
    }
}

function calcFinal() {
    var price = parseFloat(document.getElementById('assignPrice').value) || 0;
    var disc = parseFloat(document.getElementById('assignDiscount').value) || 0;
    syncPaidAmt();
}

function syncPaidAmt() {
    var price = parseFloat(document.getElementById('assignPrice').value) || 0;
    var disc = parseFloat(document.getElementById('assignDiscount').value) || 0;
    var finalAmt = Math.max(0, price - disc);
    var status = document.getElementById('assignPayStatus').value;
    var paidInput = document.getElementById('assignPaidAmt');

    if (status === 'Paid') {
        paidInput.value = finalAmt.toFixed(2);
        paidInput.readOnly = true;
    } else if (status === 'Pending') {
        paidInput.value = '0.00';
        paidInput.readOnly = true;
    } else {
        paidInput.readOnly = false;
        if (parseFloat(paidInput.value) >= finalAmt || parseFloat(paidInput.value) === 0) {
            paidInput.value = (finalAmt * 0.5).toFixed(2);
        }
    }
    calcBalance();
}

function calcBalance() {
    var price = parseFloat(document.getElementById('assignPrice').value) || 0;
    var disc = parseFloat(document.getElementById('assignDiscount').value) || 0;
    var finalAmt = Math.max(0, price - disc);
    var paid = parseFloat(document.getElementById('assignPaidAmt').value) || 0;
    var bal = Math.max(0, finalAmt - paid);

    var display = document.getElementById('assignBalanceDisplay');
    display.textContent = '₹ ' + bal.toFixed(2);
    display.style.color = (bal > 0) ? '#b91c1c' : '#15803d';
}

document.addEventListener('DOMContentLoaded', function() {
    var sel = document.getElementById('assignVoucherSelect');
    if (sel && sel.value) {
        onVoucherChange(sel);
    } else {
        calcFinal();
    }
});
</script>
{% endblock %}
