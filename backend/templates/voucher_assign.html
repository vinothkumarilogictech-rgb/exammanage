{% extends 'base.html' %}{% block content %}<div class="module-header"><h2>Assign Voucher to Student</h2></div><div class="panel"><form method="POST" class="form-grid">
<div class="form-row full"><label>Available Voucher *</label><select name="voucher_id" required><option value="">Select voucher</option>{% for v in available %}<option value="{{ v.id }}">{{ v.voucher_code }} — Cost ₹{{ '%.2f'|format(v.purchase_cost) }} — Sell ₹{{ '%.2f'|format(v.selling_price) }}</option>{% endfor %}</select></div>
<div class="form-row full"><label>Student *</label><select name="student_id" required><option value="">Select student</option>{% for s in students %}<option value="{{ s.id }}">{{ s.name }}{% if s.register_number %} — {{ s.register_number }}{% endif %}</option>{% endfor %}</select></div>
<div class="form-row"><label>Exam</label><select name="exam_type_id"><option value="">Select exam</option>{% for e in exams %}<option value="{{ e.id }}">{{ e.name }}</option>{% endfor %}</select></div>
<div class="form-row"><label>Selling Price *</label><input name="selling_price" type="number" step="0.01" min="0" required></div>
<div class="form-row"><label>Payment Status</label><select name="payment_status"><option>Pending</option><option>Partial</option><option>Paid</option></select></div>
<div class="form-row"><label>Payment Mode</label><select name="payment_mode"><option value="">Select</option><option>Cash</option><option>Bank Transfer</option><option>UPI</option><option>Card</option><option>Other</option></select></div>
<div class="form-row full"><label>Payment Reference</label><input name="payment_reference"></div><div class="form-row full"><label>Notes</label><textarea name="notes" rows="3"></textarea></div>
<div class="button-row"><button class="btn-primary">Assign Voucher</button><a class="btn-secondary" href="{{ url_for('vouchers.dashboard') }}">Cancel</a></div></form></div>{% endblock %}
