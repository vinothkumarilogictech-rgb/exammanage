<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Management Login</title>
    <style>
    * { 
        margin: 0; 
        padding: 0; 
        box-sizing: border-box; 
        font-family: 'Segoe UI', sans-serif; 
    }

    /* 1. ILOGIC TRI-COLOR MOVING GRADIENT BACKGROUND (Blue -> Purple -> Pink) */
    body { 
        height: 100vh; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        background: linear-gradient(-45deg, #2b5cff, #8c52ff, #ec4899, #2b5cff); 
        background-size: 400% 400%;
        animation: gradientMove 12s ease infinite;
        overflow: hidden; 
    }

    /* GLASSMORPHISM CARD CONTAINER */
    .container { 
        width: 1000px; 
        height: 580px; 
        display: flex; 
        border-radius: 25px; 
        overflow: hidden; 
        background: rgba(255, 255, 255, .12); 
        backdrop-filter: blur(20px); 
        -webkit-backdrop-filter: blur(20px);
        box-shadow: 0 25px 50px rgba(0,0,0,.2); 
        position: relative; 
        animation: slideUpFade 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    .left { 
        width: 55%; 
        color: white; 
        padding: 60px; 
        display: flex; 
        flex-direction: column; 
        justify-content: center; 
        text-align: center;
        background: rgba(255, 255, 255, 0.03); /* Subtle separation for left panel */
    }
    
    .brand-logo { 
        max-width: 280px; 
        height: auto; 
        margin: 0 auto 25px auto; 
        display: block; 
        animation: elementPop 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
    }
    
    .left h1 { 
        font-size: 40px; 
        margin-bottom: 15px; 
        font-weight: 700;
        letter-spacing: -0.5px;
        animation: elementPop 1s ease 0.3s both;
    }

    .left p { 
        font-size: 16px; 
        line-height: 28px; 
        opacity: .85; 
        animation: elementPop 1s ease 0.4s both;
    }

    .right { 
        width: 45%; 
        background: white; 
        padding: 60px 45px; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
    }

    .card { width: 100%; }
    
    /* Branded heading matching the signature purple center tone */
    .card h2 { color: #8c52ff; text-align: center; margin-bottom: 35px; font-size: 34px; font-weight: 700; }
    .input-box { margin-bottom: 22px; }
    .input-box label { display: block; margin-bottom: 8px; color: #475569; font-weight: 600; font-size: 14px; }
    
    .input-box input { 
        width: 100%; 
        padding: 14px; 
        border: 1px solid #cbd5e1; 
        border-radius: 10px; 
        background: #f8fafc; 
        outline: none; 
        font-size: 15px; 
        transition: all 0.3s ease;
    }

    /* TRI-COLOR BLUE SHADOW FOCUS ACCENT */
    .input-box input:focus { 
        background: white;
        border-color: #2b5cff;
        box-shadow: 0 0 0 4px rgba(43, 92, 255, 0.15); 
    }

    .password-box { position: relative; width: 100%; }
    .toggle-password { position: absolute; top: 50%; right: 15px; transform: translateY(-50%); cursor: pointer; font-size: 18px; color: #64748b; }
    
    /* 2. PREMIUM GRADIENT BUTTON MATCHING THE BRAND PILL */
    button { 
        width: 100%; 
        padding: 15px; 
        border: none; 
        border-radius: 10px; 
        background: linear-gradient(90deg, #2b5cff, #8c52ff, #ec4899);
        background-size: 200% auto;
        color: white; 
        font-size: 16px; 
        cursor: pointer; 
        font-weight: 700; 
        letter-spacing: 0.5px;
        transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Animates the gradient position across the button on hover */
    button:hover { 
        background-position: right center;
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(140, 82, 255, 0.35);
    }

    button:active {
        transform: translateY(-1px);
        box-shadow: 0 5px 12px rgba(140, 82, 255, 0.25);
    }

    .footer { margin-top: 30px; text-align: center; color: #94a3b8; font-size: 13px; }

    /* --- ANIMATION TRACKS --- */
    @keyframes gradientMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    @keyframes slideUpFade {
        0% { 
            opacity: 0; 
            transform: translateY(40px); 
        }
        100% { 
            opacity: 1; 
            transform: translateY(0); 
        }
    }

    @keyframes elementPop {
        0% {
            opacity: 0;
            transform: translateY(20px);
        }
        100% {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
</head>

        <div class="card">
            <h2>Welcome Back</h2>

    function togglePassword(){
        let pass = document.getElementById("password");
        pass.type = pass.type === "password" ? "text" : "password";
    }
</script>
